apiVersion: apiextensions.k8s.io/v1 # Hack because controller-gen complains if we don't have this
name: "Infrastructure"
crdName: infrastructures.config.openshift.io
featureGates:
- VSphereMultiAccountCredentials
tests:
  onCreate:
    - name: Should be able to create a minimal Infrastructure
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {} # No spec is required for a Infrastructure
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec: {}
    - name: Should be able to create Infrastructure with credentialsMode Passthrough
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: Passthrough
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: Passthrough
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
    - name: Should be able to create Infrastructure with credentialsMode PerComponent
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: PerComponent
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: PerComponent
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
    - name: Should reject invalid credentialsMode value
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: Invalid
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
      expectedError: "spec.platformSpec.vsphere.credentialsMode: Unsupported value"
    - name: Should be able to create Infrastructure with componentCredentials
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: PerComponent
              componentCredentials:
                machineAPI:
                  name: vsphere-creds-machine-api
                  namespace: openshift-config
                csiDriver:
                  name: vsphere-creds-csi
                  namespace: openshift-config
                cloudController:
                  name: vsphere-creds-ccm
                  namespace: openshift-config
                diagnostics:
                  name: vsphere-creds-diag
                  namespace: openshift-config
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: PerComponent
              componentCredentials:
                machineAPI:
                  name: vsphere-creds-machine-api
                  namespace: openshift-config
                csiDriver:
                  name: vsphere-creds-csi
                  namespace: openshift-config
                cloudController:
                  name: vsphere-creds-ccm
                  namespace: openshift-config
                diagnostics:
                  name: vsphere-creds-diag
                  namespace: openshift-config
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
    - name: Should reject componentCredentials with invalid namespace
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: PerComponent
              componentCredentials:
                machineAPI:
                  name: vsphere-creds-machine-api
                  namespace: kube-system
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
      expectedError: "spec.platformSpec.vsphere.componentCredentials.machineAPI.namespace: Unsupported value"
    - name: Should be able to create Infrastructure with partial componentCredentials
      initial: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: PerComponent
              componentCredentials:
                machineAPI:
                  name: vsphere-creds-machine-api
                  namespace: openshift-config
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
      expected: |
        apiVersion: config.openshift.io/v1
        kind: Infrastructure
        spec:
          platformSpec:
            type: VSphere
            vsphere:
              credentialsMode: PerComponent
              componentCredentials:
                machineAPI:
                  name: vsphere-creds-machine-api
                  namespace: openshift-config
              vcenters:
              - server: vcenter1.example.com
                datacenters:
                - datacenter1
